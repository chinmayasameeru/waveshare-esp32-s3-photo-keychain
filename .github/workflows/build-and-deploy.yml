name: Build Photo Keychain

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photo-keychain-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Install ESP32 core and LovyanGFX
        run: |
          arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10
          arduino-cli lib install LovyanGFX

      - name: Compile Photo Keychain
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,CDCOnBoot=cdc,PartitionScheme=app3M_fat9M_16MB" \
            --warnings all \
            --output-dir build \
            PhotoKeychain

      - name: Verify firmware outputs
        run: |
          set -eux
          test -s build/PhotoKeychain.ino.bin
          test -s build/PhotoKeychain.ino.bootloader.bin
          test -s build/PhotoKeychain.ino.partitions.bin
          test -s "$(find "$HOME/.arduino15" -name boot_app0.bin | head -n1)"

      - name: Build GitHub Pages bundle
        run: |
          set -eux
          rm -rf docs
          mkdir -p docs
          cp web/index.html docs/index.html
          cp build/PhotoKeychain.ino.bootloader.bin docs/bootloader.bin
          cp build/PhotoKeychain.ino.partitions.bin docs/partitions.bin
          cp "$(find "$HOME/.arduino15" -name boot_app0.bin | head -n1)" docs/boot_app0.bin
          cp build/PhotoKeychain.ino.bin docs/PhotoKeychain.bin
          printf 'Built from %s\n' "$GITHUB_SHA" > docs/build.txt
          ls -lh docs

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: waveshare-esp32-s3-photo-keychain
          path: docs/

      - name: Publish stable browser installer
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No docs changes"
            exit 0
          fi
          git commit -m "Publish Photo Keychain installer [skip ci]"
          git push origin HEAD:main
